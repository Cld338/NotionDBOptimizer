<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Notion 데이터베이스를 효율적으로 분석하고 시각화하세요">
    <meta name="theme-color" content="#0B0D12">
    <title>NotionDB — 미니멀 데이터베이스 분석</title>

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-root">
        <!-- 로그인 뷰 -->
        <div id="loginView" class="login-container">
            <div class="login-card-wrapper">
                <div class="login-card">
                    <!-- 브랜드 로고 -->
                    <div class="login-brand">
                        <span class="brand-mark" aria-hidden="true">◆</span>
                        <span class="brand-wordmark">NotionDB</span>
                    </div>

                    <!-- 설명 텍스트 -->
                    <section class="login-description">
                        <p>Notion 데이터베이스의 구조적 위험을<br>진단하고 시각화하세요.</p>
                        <ul class="feature-list" aria-label="기능 목록">
                            <li class="feature-item">
                                <span class="feature-icon" aria-hidden="true">✓</span>
                                <span class="feature-text">안전한 Notion 연동</span>
                            </li>
                            <li class="feature-item">
                                <span class="feature-icon" aria-hidden="true">✓</span>
                                <span class="feature-text">데이터 품질 분석</span>
                            </li>
                            <li class="feature-item">
                                <span class="feature-icon" aria-hidden="true">✓</span>
                                <span class="feature-text">참조 체인 시각화</span>
                            </li>
                        </ul>
                    </section>

                    <!-- CTA 버튼 -->
                    <div class="login-actions">
                        <a href="/auth/notion/login" class="btn btn-primary btn-large" role="button">
                            <span class="btn-text">Notion으로 로그인</span>
                        </a>
                    </div>

                    <!-- 하단 안내문 -->
                    <footer class="login-footer">
                        <p>아무 개인 정보도 저장되지 않습니다. 안전하게 사용하세요.</p>
                    </footer>
                </div>
            </div>
        </div>

        <!-- 메인 뷰 -->
        <div id="mainView" class="main-container is-hidden">
            <!-- 사이드바 -->
            <aside class="sidebar" role="navigation" aria-label="사이드바">
                <div class="sidebar-header">
                    <div class="app-logo">
                        <span class="logo-mark" aria-hidden="true">◆</span>
                        <span class="logo-text">NotionDB</span>
                    </div>
                </div>

                <div class="sidebar-search">
                    <div class="search-box">
                        <span class="search-icon" aria-hidden="true">🔍</span>
                        <input
                            type="text"
                            id="databaseSearchInput"
                            class="search-input"
                            placeholder="데이터베이스 검색..."
                            aria-label="데이터베이스 검색"
                            data-action="search"
                        >
                    </div>
                    <button
                        id="refreshDatabasesBtn"
                        class="icon-btn"
                        data-action="refresh-databases"
                        aria-label="DB 목록 새로 고침"
                        title="DB 목록 새로 고침"
                    >
                        <span class="material-icons-outlined" aria-hidden="true">refresh</span>
                    </button>
                </div>

                <div class="sidebar-list-header">
                    <span class="sidebar-list-title">데이터베이스</span>
                    <span id="databasesCount" class="count-text" aria-live="polite">0개</span>
                </div>

                <!-- 데이터베이스 목록 -->
                <nav id="databasesList" class="sidebar-db-list" role="list" aria-label="데이터베이스 목록">
                    <div class="loading-card" role="status" aria-label="로딩 중">
                        <div class="loading-spinner"></div>
                        <p>로딩 중...</p>
                    </div>
                </nav>

                <footer class="sidebar-footer">
                    <div class="user-card">
                        <div class="user-avatar" aria-hidden="true">👤</div>
                        <div class="user-details">
                            <div class="user-name" id="userName"></div>
                            <a href="/logout" class="btn-logout">로그아웃</a>
                        </div>
                    </div>
                </footer>
            </aside>

            <!-- 메인 콘텐츠 -->
            <main class="main-content">
                <!-- 빈 상태 (데이터베이스 미선택) -->
                <section id="databasesView" class="view-section empty-state-view">
                    <div class="empty-state-hero">
                        <div class="empty-state-icon" aria-hidden="true">◇</div>
                        <h1>데이터베이스를 선택하세요</h1>
                        <p>왼쪽 목록에서 분석할 Notion 데이터베이스를 클릭하면<br>데이터 품질과 참조 체인 분석 결과가 여기에 표시됩니다.</p>
                    </div>
                </section>

                <!-- 데이터베이스 상세 보기 -->
                <section id="databaseDetail" class="view-section is-hidden">
                    <header class="content-topbar">
                        <h1 id="databaseTitle" class="detail-title"></h1>
                        <button
                            id="refreshBtn"
                            class="icon-btn"
                            data-action="refresh-current"
                            aria-label="데이터 새로 고침"
                            title="데이터 새로 고침"
                        >
                            <span class="material-icons-outlined" aria-hidden="true">refresh</span>
                        </button>
                    </header>

                    <!-- 분석 콘텐츠 -->
                    <div id="analysisTab" class="tab-content">
                        <div id="analysisPlaceholder" class="card">
                            <div class="card-content">
                                <div class="loading-spinner"></div>
                                <p>분석 중...</p>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 알림 메시지 컨테이너 -->
    <div id="messagesContainer" class="messages-container" role="region" aria-live="polite" aria-label="알림 메시지"></div>

    <!-- 최적화 제안 모달 -->
    <dialog 
        id="optimizationModal" 
        class="optimization-modal"
        aria-labelledby="optimizationModalTitle"
        aria-describedby="optimizationModalBody"
    >
        <div class="optimization-modal-content">
            <header class="optimization-modal-header">
                <h2 class="optimization-modal-title" id="optimizationModalTitle"></h2>
                <button 
                    class="optimization-modal-close" 
                    data-action="close-modal"
                    aria-label="모달 닫기"
                    type="button"
                >×</button>
            </header>
            <div class="optimization-modal-body" id="optimizationModalBody"></div>
        </div>
    </dialog>

    <!-- 스크립트 -->
    <script src="script.js" defer></script>
</body>
</html>
